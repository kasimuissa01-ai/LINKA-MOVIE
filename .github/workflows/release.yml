name: Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build Signed APK and Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is not set. Refusing to build with a throwaway keystore."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > app/my-upload-key.jks

      - name: Extract Version Info from Tag
        id: version_extract
        run: |
          TAG="${{ github.ref_name }}"
          VERSION_NAME="${TAG#v}"

          # Parse SemVer (e.g. 1.4.0 -> Major=1, Minor=4, Patch=0)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          PATCH=${PATCH:-0}

          # Compute monotonic versionCode (e.g., 10400)
          VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))

          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "Tag: $TAG, VersionName: $VERSION_NAME, VersionCode: $VERSION_CODE"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: app/my-upload-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PversionCode="${{ env.VERSION_CODE }}" \
            -PversionName="${{ env.VERSION_NAME }}"

      - name: Verify APK Exists
        run: |
          ls -la app/build/outputs/apk/release/

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release and Attach APK
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
