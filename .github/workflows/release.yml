name: Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build Signed APK and Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode or Generate Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding provided KEYSTORE_BASE64 secret..."
            # Strip any accidental whitespace or newlines before decoding
            CLEANED_B64=$(echo "$KEYSTORE_BASE64" | tr -d '\r\n\t ')
            echo "$CLEANED_B64" | base64 -d > app/my-upload-key.jks || echo "$CLEANED_B64" | base64 --decode > app/my-upload-key.jks
            cp app/my-upload-key.jks ./my-upload-key.jks
            echo "Keystore decoded successfully."
          else
            echo "KEYSTORE_BASE64 secret not found. Generating release signing keystore automatically..."
            PASS="${KEYSTORE_PASSWORD:-movieroom_store_pass}"
            ALIAS="${KEY_ALIAS:-upload}"
            KEYPASS="${KEY_PASSWORD:-$PASS}"
            keytool -genkey -v -keystore app/my-upload-key.jks -keyalg RSA -keysize 2048 -validity 10000 \
              -alias "$ALIAS" \
              -dname "CN=MovieRoom, OU=App, O=MovieRoom, L=Streaming, S=Mobile, C=US" \
              -storepass "$PASS" \
              -keypass "$KEYPASS"
            cp app/my-upload-key.jks ./my-upload-key.jks
            echo "Keystore generated successfully."
          fi

      - name: Extract Version Info
        id: version_extract
        run: |
          REF_NAME="${{ github.ref_name }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_NAME="${REF_NAME#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
            PATCH=${PATCH:-0}
            VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          else
            VERSION_NAME="1.0.${{ github.run_number }}"
            VERSION_CODE=$(( 10000 + ${{ github.run_number }} ))
          fi
          
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "Ref: $REF_NAME, VersionName: $VERSION_NAME, VersionCode: $VERSION_CODE"

      - name: Ensure Gradle Executable
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper || true
          fi
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: app/my-upload-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'movieroom_store_pass' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'movieroom_store_pass' }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease \
              -PversionCode="${{ env.VERSION_CODE }}" \
              -PversionName="${{ env.VERSION_NAME }}"
          else
            gradle assembleRelease \
              -PversionCode="${{ env.VERSION_CODE }}" \
              -PversionName="${{ env.VERSION_NAME }}"
          fi

      - name: Verify APK Output
        run: |
          ls -la app/build/outputs/apk/release/

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ env.VERSION_NAME }}
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release and Attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.VERSION_NAME }}"
          name: "Release v${{ env.VERSION_NAME }}"
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
