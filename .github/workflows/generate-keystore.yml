name: Generate Release Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate keystore
        env:
          STORE_PASSWORD: ${{ secrets.TEMP_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TEMP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TEMP_KEY_PASSWORD }}
        run: |
          keytool -genkeypair -v \
            -keystore movieroom-release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=MovieRoom, OU=Dev, O=MovieRoom, L=City, S=State, C=US"
          base64 -w 0 movieroom-release.jks > keystore-base64.txt

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: keystore-base64.txt
          retention-days: 1
